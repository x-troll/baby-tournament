name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Dummy but well-formed — nothing in lint/typecheck/vitest/build touches
  # a live DB (the bracket engine tests are 100% DB-free by design, and
  # no page statically pre-renders DB-backed content at build time), but
  # src/lib/prisma.ts constructs its adapter from this at module load, so
  # it needs to at least be present.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  AUTH_SECRET: "ci-only-secret-not-for-real-use-00000000000000000000000000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
