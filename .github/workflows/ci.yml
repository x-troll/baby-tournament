name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Dummy but well-formed — nothing in lint/typecheck/vitest/build touches
  # a live DB (the bracket engine tests are 100% DB-free by design, and
  # no page statically pre-renders DB-backed content at build time), but
  # src/lib/prisma.ts constructs its adapter from this at module load, so
  # it needs to at least be present.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  AUTH_SECRET: "ci-only-secret-not-for-real-use-00000000000000000000000000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  a11y:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Skin is a server-startup-time env var, not a runtime toggle
        # (see src/lib/terminology.ts), so covering all 4 theme
        # combinations means running the suite once per skin — light vs
        # dark within each run is handled inside the spec file itself via
        # Playwright's colorScheme emulation.
        skin: [nursery, plain]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_SECRET: "ci-only-secret-not-for-real-use-00000000000000000000000000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      THEME: ${{ matrix.skin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
